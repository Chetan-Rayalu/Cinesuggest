<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="500" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121118"/>
      <stop offset="0.5" stop-color="#1a1829"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <rect x="20" y="20" width="460" height="710" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Film Icon -->
  <g transform="translate(200, 280)">
    <rect width="100" height="100" rx="24" fill="url(#purpleGrad)" />
    <path d="M35 30 L65 50 L35 70 Z" fill="#ffffff" />
    <circle cx="80" cy="20" r="4" fill="#FDE047"/>
  </g>

  <!-- Typography -->
  <text x="250" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">CineSuggest</text>
  <text x="250" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="medium" fill="#A1A1AA">Cinema Artwork Coming Soon</text>
</svg>
